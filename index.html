<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XRPL Scan Pro v3 (Batch & Check)</title>
    <meta name="theme-color" content="#0d1117">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 12px; min-height: 100vh; display: flex; flex-direction: column; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .val { font-size: 1.2rem; font-weight: bold; color: #58a6ff; }
        .lbl { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
        button { background: #238636; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; }
        button.stop { background: #da3633; }
        input { width: 100%; background: #010409; border: 1px solid #30363d; color: #7ee787; padding: 8px; border-radius: 4px; font-family: monospace; font-size: 0.8rem; margin-top: 5px; }
        .log-box { height: 180px; overflow-y: auto; background: #010409; font-size: 0.7rem; color: #7ee787; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-bottom: 10px; font-size: 1.1rem;">Motor XRPL <span id="status" style="color: #8b949e;">[Inactivo]</span></h2>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <div style="flex:1; text-align:center;">
                <div class="val" id="checked">0</div>
                <div class="lbl">Generadas</div>
            </div>
            <div style="flex:1; text-align:center;">
                <div class="val" id="found" style="color:#f0883e;">0</div>
                <div class="lbl">Hallazgos</div>
            </div>
        </div>
        <button id="toggleBtn" onclick="toggle()">Iniciar Escaneo</button>
    </div>

    <div class="card">
        <label class="lbl">Último Hallazgo (Address)</label>
        <input type="text" id="addr" readonly>
        <label class="lbl" style="margin-top:10px; display:block;">Secret Seed</label>
        <input type="text" id="seed" readonly>
    </div>

    <div class="card" style="flex:1;">
        <div class="log-box" id="log">Sistema listo. Esperando inicio.</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xrpl@3.1.0/build/xrpl-latest-min.js"></script>
    <script>
        const logEl = document.getElementById('log');
        function log(m) { 
            const now = new Date().toLocaleTimeString().split(' ')[0];
            logEl.textContent = `[${now}] ${m}\n` + logEl.textContent;
            console.log(m);
        }

        const xrplLib = (typeof xrpl !== 'undefined') ? xrpl : null;
        let running = false;
        let stats = { checked: 0, found: 0 };

        // Recuperar hallazgos de localStorage
        let hits = JSON.parse(localStorage.getItem('xrpl_hits') || '[]');

        function toggle() {
            running = !running;
            document.getElementById('toggleBtn').innerText = running ? "Detener" : "Iniciar Escaneo";
            document.getElementById('toggleBtn').className = running ? "stop" : "";
            document.getElementById('status').innerText = running ? "[ACTIVO]" : "[Inactivo]";
            if(running) runScanner();
        }

        async function runScanner() {
            log("Iniciando escaneo batch...");
            while(running) {
                // Batch de 5 para no colapsar el hilo del móvil
                for(let i=0; i<5; i++) {
                    const wallet = xrplLib.Wallet.generate();
                    stats.checked++;
                    
                    // Simulación de check balance (aquí podrías conectar a un nodo real)
                    // Por ahora solo logueamos actividad
                    if(stats.checked % 20 === 0) {
                        document.getElementById('checked').innerText = stats.checked;
                        document.getElementById('addr').value = wallet.address;
                        document.getElementById('seed').value = wallet.seed;
                    }
                }
                await new Promise(r => setTimeout(r, 100));
            }
        }
    </script>
</body>
</html>

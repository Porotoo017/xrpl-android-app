<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XRPL Scan PRO</title>
    <meta name="theme-color" content="#0d1117">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 12px; min-height: 100vh; display: flex; flex-direction: column; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
        .val { font-size: 1.4rem; font-weight: bold; color: #58a6ff; }
        .lbl { font-size: 0.75rem; color: #8b949e; }
        button { background: #238636; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 1rem; }
        button.stop { background: #da3633; }
        .input-row { display: flex; gap: 8px; margin-top: 5px; }
        input { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #58a6ff; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.9rem; }
        .log-box { height: 150px; overflow-y: auto; background: #010409; font-size: 0.75rem; color: #7ee787; padding: 8px; border-radius: 6px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-bottom: 10px;">Motor Escaneo <span id="status" style="color: #8b949e;">[Inactivo]</span></h2>
        <div style="display:flex; gap:10px; margin-bottom:10px;">
            <div style="flex:1; text-align:center;">
                <div class="val" id="checked">0</div>
                <div class="lbl">Probadas</div>
            </div>
            <div style="flex:1; text-align:center;">
                <div class="val" id="found" style="color:#f0883e;">0</div>
                <div class="lbl">Hallazgos</div>
            </div>
        </div>
        <button id="toggleBtn" onclick="toggle()">Iniciar Escaneo</button>
    </div>

    <div class="card">
        <label>Última Dirección (XRPL)</label>
        <div class="input-row">
            <input type="text" id="addr" readonly>
            <button style="width:auto;" onclick="copy('addr')">Copy</button>
        </div>
        <label style="margin-top:10px; display:block;">Secret Seed</label>
        <div class="input-row">
            <input type="text" id="seed" readonly>
            <button style="width:auto;" onclick="copy('seed')">Copy</button>
        </div>
    </div>

    <div class="card" style="flex:1;">
        <div class="log-box" id="log">Sistema listo. Presiona iniciar...</div>
    </div>

    <script src="https://unpkg.com/xrpl@5.3.0/dist/npm/index.js"></script>
    <script>
        let running = false;
        let c = 0;
        const logEl = document.getElementById('log');
        
        function log(m) { 
            const now = new Date().toLocaleTimeString().split(' ')[0];
            logEl.textContent = `[${now}] ${m}\n` + logEl.textContent;
        }
        function copy(id) { 
            const val = document.getElementById(id).value;
            if(val) navigator.clipboard.writeText(val).then(() => log("Copiado: " + id));
        }
        
        function toggle() {
            running = !running;
            document.getElementById('toggleBtn').innerText = running ? "Detener" : "Iniciar Escaneo";
            document.getElementById('toggleBtn').className = running ? "stop" : "";
            document.getElementById('status').innerText = running ? "[ACTIVO]" : "[Inactivo]";
            log(running ? "Motor iniciado." : "Motor detenido.");
            if(running) loop();
        }

        async function loop() {
            // Check if xrpl is loaded
            if (typeof xrpl === 'undefined') {
                log("Error: xrpl lib no cargada");
                return;
            }
            while(running) {
                try {
                    const w = xrpl.Wallet.generate();
                    c++;
                    document.getElementById('checked').innerText = c;
                    document.getElementById('addr').value = w.address;
                    document.getElementById('seed').value = w.seed;
                    if(c % 5 === 0) log("Escaneando... " + w.address.substring(0,6));
                    await new Promise(r => setTimeout(r, 50));
                } catch(e) {
                    log("Error: " + e.message);
                    await new Promise(r => setTimeout(r, 1000));
                }
            }
        }
    </script>
</body>
</html>
